<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | Nurahub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <main class="page-shell">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-4">
                    <div class="hero-panel h-100">
                        <div class="d-flex align-items-center gap-3 mb-4">
                            <div class="brand-mark">N</div>
                            <div class="brand-badge">Your profile</div>
                        </div>
                        <h1 class="page-title">Account center.</h1>
                        <p class="page-subtitle">Your authenticated session is stored in Redis and protected on every request.</p>

                        <div class="summary-box mt-4">
                            <div class="profile-summary">
                                <div class="profile-chip">Signed in user</div>
                                <div class="profile-info-grid">
                                    <div class="profile-info-card">
                                        <label>Username</label>
                                        <strong id="profileUsername">Loading...</strong>
                                    </div>
                                    <div class="profile-info-card">
                                        <label>Email</label>
                                        <strong id="profileEmail">Loading...</strong>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <button type="button" class="btn btn-ghost w-100 mt-4" id="logoutButton">Logout</button>
                    </div>
                </div>
                <div class="col-lg-8">
                    <div class="profile-panel">
                        <div class="profile-header">
                            <div>
                                <h2 class="h3 fw-bold mb-2">Profile details</h2>
                                <p class="text-secondary mb-0">Edit your MongoDB-backed profile information without reloading the page.</p>
                            </div>
                        </div>
                        <div id="profileAlert" class="alert alert-soft d-none" role="alert"></div>
                        <form id="profileForm" novalidate>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="name" class="form-label">Name</label>
                                    <input type="text" class="form-control" id="name" name="name" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="age" class="form-label">Age</label>
                                    <input type="number" class="form-control" id="age" name="age" min="1" max="120" required>
                                </div>
                                <div class="col-12">
                                    <label for="bio" class="form-label">Bio</label>
                                    <textarea class="form-control profile-bio" id="bio" name="bio" rows="5"></textarea>
                                </div>
                                <div class="col-12">
                                    <label for="interests" class="form-label">Interests</label>
                                    <input type="text" class="form-control" id="interests" name="interests" placeholder="Design, PHP, APIs, MongoDB">
                                    <div class="interest-list" id="interestPreview"></div>
                                </div>
                                <div class="col-12 d-grid d-sm-flex gap-3 mt-2">
                                    <button type="submit" class="btn btn-brand" id="saveProfileButton">Save Profile</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/profile.js"></script>
</body>
</html>
