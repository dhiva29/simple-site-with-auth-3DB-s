<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Nurahub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <main class="page-shell">
        <div class="container">
            <div class="row g-4 align-items-center">
                <div class="col-lg-6">
                    <div class="hero-panel h-100">
                        <div class="d-flex align-items-center gap-3">
                            <div class="brand-mark">N</div>
                            <div class="brand-badge">Secure Login</div>
                        </div>
                        <h1 class="page-title">Welcome back.</h1>
                        <p class="page-subtitle">Sign in with your username or email and continue into your protected profile area.</p>

                        <div class="hero-stack">
                            <div class="hero-stat">
                                <span>Session storage</span>
                                <strong>Redis</strong>
                            </div>
                            <div class="hero-stat">
                                <span>Account storage</span>
                                <strong>MySQL</strong>
                            </div>
                            <div class="hero-stat">
                                <span>Profile storage</span>
                                <strong>MongoDB Atlas</strong>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-5 ms-lg-auto">
                    <div class="auth-panel">
                        <div class="mb-4">
                            <h2 class="h3 fw-bold mb-2">Login</h2>
                            <p class="text-secondary mb-0">Use AJAX to sign in without a page refresh.</p>
                        </div>
                        <div id="loginAlert" class="alert alert-soft d-none" role="alert"></div>
                        <form id="loginForm" novalidate>
                            <div class="mb-3">
                                <label for="identifier" class="form-label">Username or email</label>
                                <input type="text" class="form-control" id="identifier" name="identifier" autocomplete="username" required>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
                            </div>
                            <button type="submit" class="btn btn-brand w-100" id="loginSubmit">Login</button>
                        </form>
                        <div class="auth-footer">
                            <span class="text-secondary">Need an account?</span>
                            <a class="helper-link" href="register.html">Register here</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/login.js"></script>
</body>
</html>
